---
#
# Group folder structures to construct on shared storage systems.
#
group_subfolder_structure:
  ######################################################################################################################
  # umcg-atd group
  ######################################################################################################################
  - group: umcg-atd
    lfs: tmp07
    mode: "{{ MODE_2770_HARD }}"
    owner: umcg-atd-ateambot
    subfolders: "{{ analysis_folders['ConcordanceCheck']['tmp']
            | union(analysis_folders['NGS_Demultiplexing']['tmp'])
            | union(analysis_folders['NGS_DNA']['tmp'])
            | union(analysis_folders['trendanalysis']['tmp']) }}"
    machines: "{{ groups['user_interface'] }}"
  - group: umcg-atd
    lfs: dat07
    mode: "{{ MODE_2770_HARD }}"
    owner: umcg-atd-dm
    subfolders: "{{ analysis_folders['ConcordanceCheck']['dat']
            | union(analysis_folders['NGS_Demultiplexing']['dat'])
            | union(analysis_folders['NGS_DNA']['dat'])
            | union(analysis_folders['trendanalysis']['dat']) }}"
    machines: "{{ groups['chaperone'] }}"
  - group: umcg-atd
    lfs: prm07
    mode: "{{ MODE_2750_HARD }}"
    owner: umcg-atd-dm
